<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Patriot ordering demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: three-column order desk. Left: orders, approvals, past orders, templates. Center: the open order as an
   editable table; items with several versions expand to show them. Right: details for the selection (can be hidden).
   Look: white and cool grey on a faint drafting grid, a dark command bar, electric blue for actions, status as small
   lit dots, numbers and IDs in a monospace face. Light only, on purpose. */
:root{
  color-scheme:light;
  --bg:#eef0f4; --grid:rgba(30,40,60,.04); --panel:#ffffff; --panel-2:#f6f7fa; --hover:#f3f5f9; --sel:#edf2ff;
  --line:#e2e5eb; --line-2:#cdd2da;
  --ink:#141a26; --ink-2:#4a5263; --ink-3:#7b8496;
  --hdr:#0b1f4d; --hdr-ink:#e8ecf4; --hdr-ink-2:#9fb0d4;
  --accent:#1f3f9e; --accent-2:#16307d; --accent-soft:#e9eefb; --glow:0 0 0 3px rgba(31,63,158,.18);
  --red:#ed1c24; --focus:#1f3f9e; --cut:#d6247a;
  --rigid:#1f3f9e; --roll:#d0731f; --dtf:#0d9488; --none:#9aa2b0;
  --good:#16884a; --warn:#a16a00; --crit:#c8372d; --info:#1f3f9e;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button{font:inherit;color:inherit}
.num{font-family:var(--mono);font-size:.93em;font-variant-numeric:tabular-nums}
kbd{font:500 10.5px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);background:var(--panel-2);white-space:nowrap}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink)}
.hdr-in{display:flex;align-items:center;gap:18px;height:52px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.logo i{width:11px;height:11px;border-radius:2px;background:var(--red);box-shadow:3px 3px 0 var(--accent)}
.nav{display:flex;gap:16px;height:100%}
.nav button{display:flex;align-items:center;color:var(--hdr-ink-2);background:none;border:0;border-bottom:2px solid transparent;font-weight:600;font-size:13.5px;cursor:pointer;padding:0}
.nav button:hover{color:var(--hdr-ink)}
.nav button.on{color:#fff;border-color:var(--accent)}
.cmdk{display:flex;align-items:center;gap:8px;min-width:250px;padding:6px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--hdr-ink-2);cursor:pointer;font-size:13px}
.cmdk:hover{border-color:rgba(255,255,255,.28);color:var(--hdr-ink)}
.cmdk svg{width:15px;height:15px;flex:none}
.cmdk kbd{margin-left:auto;background:transparent;border-color:rgba(255,255,255,.22);color:var(--hdr-ink-2)}
.hspace{margin-left:auto}
.hbtn{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.14)}
.hbtn kbd{background:transparent;border-color:rgba(255,255,255,.25);color:var(--hdr-ink-2)}
.who{display:flex;align-items:center;gap:9px;padding:4px 9px 4px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:none;color:#fff;cursor:pointer;text-align:left}
.who:hover{background:rgba(255,255,255,.08)}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.who span{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.who small{display:block;font-size:11px;color:var(--hdr-ink-2)}
.hdr .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
/* Patriot branding: white header so the full-color logo reads, navy and red stripe under it */
.hdr{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hdr::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--accent) 0 72%,var(--red) 72% 100%)}
.hdr-in{height:62px}
.logo{gap:12px}
.logo .pmark{height:46px;width:auto;display:block;flex:none}
.logo .lt{display:flex;flex-direction:column;line-height:1.15;font-size:14px;font-weight:800;color:var(--ink);padding-left:12px;border-left:1px solid var(--line)}
.logo .lt small{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.nav button{color:var(--ink-3)} .nav button:hover{color:var(--ink)} .nav button.on{color:var(--ink);border-color:var(--red)}
.cmdk{border-color:var(--line-2);background:var(--panel-2);color:var(--ink-3)} .cmdk:hover{border-color:var(--ink-3);color:var(--ink)} .cmdk kbd{border-color:var(--line-2);color:var(--ink-3)}
.hbtn{border-color:var(--line-2);background:#fff;color:var(--ink)} .hbtn:hover{background:var(--hover)} .hbtn kbd{border-color:var(--line-2);color:var(--ink-3)}
.who{border-color:var(--line-2);color:var(--ink)} .who:hover{background:var(--hover)} .who small{color:var(--ink-3)}
.hdr .btn{background:#fff;border-color:var(--line-2);color:var(--ink)}
.side-top .btn.pri{background:var(--red);border-color:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(237,28,36,.3)}
.side-top .btn.pri:hover{background:#cf1219}
@media (max-width:720px){ .logo .lt{display:none} }

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-weight:700;font-size:13px;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--hover);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(31,63,158,.3)}
.btn.pri:hover{background:var(--accent-2)}
.btn.pri kbd{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:4px 6px;box-shadow:none}
.btn.link:hover{text-decoration:underline;background:none}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn.danger.pri{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:none}
.btn.good.pri{background:var(--good);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.btn.wide{width:100%}
.btn.sm{padding:4px 8px;font-size:12px}
.mobile-only{display:none}

/* columns */
.cols{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:14px;min-height:0;padding-block:14px;position:relative}
body.nopane .cols{grid-template-columns:250px minmax(0,1fr)}
body.nopane .pane{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.drawer-bar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.drawer-bar b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.backdrop{position:fixed;inset:0;background:rgba(10,15,25,.32);z-index:15}

/* sidebar */
.side{overflow:auto;display:flex;flex-direction:column}
.side-top{padding:12px;border-bottom:1px solid var(--line)}
.side-sec{padding:10px 6px 12px;border-bottom:1px solid var(--line)}
.side-sec:last-child{border-bottom:0}
.side-h{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:2px 8px 6px;display:flex;justify-content:space-between}
.tree{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px;width:100%;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;position:relative}
.tree:hover{background:var(--hover)}
.tree.on{background:var(--sel)}
.tree.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.tree .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tree.on .nm{font-weight:800}
.tree .cnt{font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.tree svg{width:17px;height:17px}
.ico{color:#8b95a6;display:grid;place-items:center} .ico.navy{color:var(--accent)} .ico.warn{color:var(--warn)}
.flag{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;margin-left:6px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.search{display:block;width:calc(100% - 16px);margin:0 8px 6px;padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.side .note{padding:2px 8px}

/* main */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.mhead{padding:12px 16px 0;border-bottom:1px solid var(--line)}
.crumbs{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:5px 0 2px}
.ttl h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.015em}
.tag{font:600 11px/1.6 var(--mono);padding:1px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.tag.paid{color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent);background:var(--accent-soft)}
.tag.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent);background:color-mix(in srgb,var(--good) 8%,#fff)}
.tag.appr{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent);background:color-mix(in srgb,var(--warn) 8%,#fff)}
.stepper{display:flex;flex-wrap:wrap;gap:4px 0;list-style:none;margin:8px 0 4px;padding:0;font-size:12px;color:var(--ink-3)}
.stepper li{display:flex;align-items:center;gap:7px;font-weight:600}
.stepper li:not(:last-child)::after{content:"";width:22px;height:1px;background:var(--line-2);margin:0 8px}
.stepper li.done:not(:last-child)::after{background:var(--accent)}
.stepper i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;flex:none}
.stepper li.done{color:var(--ink-2)}
.stepper li.done i{background:var(--accent);border-color:var(--accent)}
.stepper li.now{color:var(--ink);font-weight:800}
.stepper li.now i{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
.meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.meta span b{color:var(--ink-3);font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
.tools .sp{flex:1}
.selinfo{font-size:12.5px;color:var(--ink-2)}
.banner{margin:0 -16px;padding:9px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:color-mix(in srgb,var(--warn) 9%,#fff);border-top:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.info{background:var(--accent-soft);border-top-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner .grow{flex:1;min-width:200px}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 -16px;padding:8px 16px;background:var(--hdr);color:#fff}
.bulk b{font-size:13px;margin-right:4px;white-space:nowrap}
.bulk .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;padding:4px 9px;font-size:12.5px;box-shadow:none}
.bulk .btn:hover{background:rgba(255,255,255,.18)}
.bulk .btn kbd{background:transparent;border-color:rgba(255,255,255,.3);color:#cfd6e4}
.bulk .btn:disabled{opacity:.35}
.bulk .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 2px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--panel-2);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--ink-3);cursor:pointer;border-radius:5px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.12)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* popover menus */
.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 32px rgba(20,30,50,.16);width:300px;max-height:min(70vh,520px);overflow:auto;padding:5px}
.menu button{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:0}
.menu b{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.menu small{display:block;color:var(--ink-3);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .mh{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 2px}
.menu .pf{padding:8px 10px 10px;display:grid;gap:10px}
.menu .pf .acts{justify-content:flex-end}
.menu .opt{display:flex!important;align-items:center;gap:10px}
.menu .opt kbd{flex:none;min-width:20px;text-align:center}
.menu .opt span{flex:1;min-width:0}
.menu .opt[aria-current="true"] b::after{content:"current";font:600 10px var(--mono);color:var(--accent);margin-left:8px}
.issue{padding:8px 10px;border-radius:8px;border:1px solid var(--line);display:grid;gap:6px;font-size:12.5px}
.issue b{font-size:13px}
.issue.block{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 6%,#fff)}
.issue .acts{justify-content:flex-start}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--route);display:inline-block;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--route) 16%,transparent)}
.r-rigid{--route:var(--rigid)} .r-roll{--route:var(--roll)} .r-dtf{--route:var(--dtf)} .r-none{--route:var(--none)}

/* table */
.list{overflow:auto;position:relative}
.list.dropping{outline:2px dashed var(--accent);outline-offset:-6px;background:color-mix(in srgb,var(--accent) 4%,#fff)}
table{width:100%;min-width:1040px;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel-2);z-index:1;text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
tbody tr.droptarget td{background:var(--accent-soft)!important;box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
tr.ver td{background:var(--panel-2)}
tr.ver:hover td{background:var(--hover)}
tr.ver.sel td{background:var(--sel)}
tr.ver td.c-name{padding-left:2px}
tr.ver .iname b{font-weight:600}
td.r,th.r{text-align:right}
td.c-exp,th.c-exp{width:60px;padding-right:0;white-space:nowrap}
.c-exp input[type=checkbox]{width:15px;height:15px;margin:0 5px 0 2px;vertical-align:middle;cursor:pointer}
.c-exp .exp{display:inline-grid;vertical-align:middle}
td.c-th{width:52px}
.exp{border:0;background:none;width:24px;height:24px;border-radius:6px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.exp:hover{background:var(--line)}
.exp svg{width:12px;height:12px;transition:transform .12s}
.exp.open svg{transform:rotate(90deg)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.thumb{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden;background:conic-gradient(#eef0f3 25%,#fff 0 50%,#eef0f3 0 75%,#fff 0) 0 0/8px 8px;position:relative}
.thumb img{max-width:100%;max-height:100%;display:block;pointer-events:none}
.thumb.empty{border-style:dashed;font-size:10px;color:var(--ink-3);text-align:center;line-height:1.1}
.thumb.stack{box-shadow:3px 3px 0 -1px #fff,3px 3px 0 0 var(--line-2),6px 6px 0 -1px #fff,6px 6px 0 0 var(--line)}
.thumb.big{width:74px;height:74px}
.thumb.sm{width:32px;height:32px}
.iname b{font-weight:700;display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iname small{color:var(--ink-3);font-size:11.5px;display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat{display:flex;align-items:center;gap:7px;white-space:nowrap}
.ie{font:inherit;font-size:12.5px;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;max-width:100%;cursor:pointer}
.ie:hover{border-color:var(--line-2);background:#fff}
.ie:focus{outline:0;border-color:var(--accent);box-shadow:var(--glow);background:#fff}
select.ie{appearance:none;-webkit-appearance:none;padding-right:16px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 9px) 52%,calc(100% - 5px) 52%;background-size:4px 4px;background-repeat:no-repeat}
input.ie{cursor:text;font-family:var(--mono);font-size:12px;width:46px;text-align:right}
input.ie.q{width:58px}
.ie-mat{display:flex;align-items:center;gap:2px}
.ie-mat select[data-ie="mat"]{max-width:132px}
.ie-size{display:inline-flex;align-items:center;gap:1px;color:var(--ink-3);font-size:12px;white-space:nowrap}
button.ie{text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
button.ie.empty{color:var(--ink-3)}
.shipl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.shipl svg{width:13px;height:13px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;font-family:var(--font)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(.95);box-shadow:0 0 0 2px color-mix(in srgb,currentColor 18%,transparent)}
.st-good{color:var(--good);background:color-mix(in srgb,var(--good) 8%,#fff);border-color:color-mix(in srgb,var(--good) 22%,transparent)}
.st-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,#fff);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.st-crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,#fff);border-color:color-mix(in srgb,var(--crit) 22%,transparent)}
.st-info{color:var(--info);background:var(--accent-soft);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.nicon{display:inline-block;width:12px;height:12px;vertical-align:-2px;color:var(--ink-3);margin-left:4px}

.bigacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:28px 24px}
.bigact{border:1px dashed var(--line-2);border-radius:10px;padding:18px 14px;background:#fff;cursor:pointer;text-align:left;display:grid;gap:5px;align-content:start;transition:border-color .12s,box-shadow .12s}
.bigact:hover{border-color:var(--accent);box-shadow:var(--glow)}
.bigact.pri{border:1px solid var(--accent)}
.bigact svg{width:22px;height:22px;color:var(--accent)}
.bigact b{font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bigact small{color:var(--ink-3);font-size:12.5px;line-height:1.4}
.emptynote{padding:0 24px 24px;color:var(--ink-3);font-size:13px}

.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
.fstat{display:flex;flex-direction:column;gap:3px;align-items:flex-start;flex:1;min-width:0}
.fstat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (min-width:721px){ .foot{flex-wrap:nowrap} }
.fstat small{font-size:12px;color:var(--ink-3)}
.total{margin-left:auto;text-align:right;line-height:1.1}
.total small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.total b{font:700 22px/1.1 var(--mono);letter-spacing:-.02em}

/* details panel */
.pane{overflow:auto}
.ph{padding:14px 16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.ph h2{margin:5px 0 0;font-size:18px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.ph p{margin:5px 0 0;color:var(--ink-3);font-size:13px;line-height:1.45}
.upbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;margin-bottom:6px}
.pb{padding:12px 16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.pb:last-child{border-bottom:0}
.pb h3{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.f{display:grid;gap:5px;min-width:0}
.f>label,.flabel{font-size:12px;font-weight:700;color:var(--ink-2)}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=email],.f input[type=url],.f select,.f textarea,.pb select{font:inherit;font-size:13.5px;width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus,.pb select:focus,.search:focus,.cell:focus{outline:0;border-color:var(--accent);box-shadow:var(--glow)}
.f input[type=number]{font-family:var(--mono)}
.f :disabled{background:var(--panel-2);color:var(--ink-3)}
.f textarea{resize:vertical;min-height:58px}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{display:flex;gap:6px;align-items:center}
.inl input,.inl select{flex:1;min-width:0}
.checks{display:grid;gap:7px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check span{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.radio input{margin-top:3px}
.radio small{display:block;color:var(--ink-3);font-size:12px}
.artrow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.artrow .btn{margin-top:6px}
.lines{display:grid;gap:5px;font-size:13px}
.line{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}
.line span:last-child{color:var(--ink);font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.line.tot{font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.line.tot span:last-child{font-weight:700;font-size:13.5px}
.line.save span{color:var(--good)!important}
.tiers{width:100%;min-width:0;border-collapse:collapse;font-size:12.5px}
.tiers th{position:static;background:none;padding:4px 6px;font-size:10px}
.tiers td{padding:5px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.tiers tr.cur td{background:var(--accent-soft);font-weight:700}
.tiers tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tiers .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 35%,#fff)}
.tiers tr.cur .bar{background:var(--accent)}
.nudge{font-size:12.5px;color:var(--good);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.45}
.callout{padding:10px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:13px;line-height:1.45;display:grid;gap:8px}
.callout.warn{background:color-mix(in srgb,var(--warn) 8%,#fff);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--crit) 6%,#fff);border:1px solid color-mix(in srgb,var(--crit) 25%,transparent);font-size:13px;font-weight:600}
.shipto{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.shipto .inl input{font-weight:700}
.shipto .def{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cell{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line-2);border-radius:6px;background:#fff;color:var(--ink);width:100%;min-width:0}
.mlist{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);max-height:220px;overflow:auto}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(12,18,30,.42);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border:1px solid var(--line-2);border-radius:12px;width:min(540px,100%);max-height:92%;overflow:auto;box-shadow:0 20px 50px rgba(15,25,45,.25)}
.modal.wide{width:min(840px,100%)}
.modal.xwide{width:min(1020px,100%)}
.modal.cmd{width:min(600px,100%);align-self:start;margin-top:9vh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.cmdq{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:600 16px var(--font);outline:0;color:var(--ink)}
.cmdlist{max-height:52vh;overflow:auto;padding:6px}
.cmdh{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.cmdi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;text-align:left;font-weight:600}
.cmdi.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cmdi small{color:var(--ink-3);font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap}
.aicard{margin:6px;padding:12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:linear-gradient(180deg,var(--accent-soft),#fff);display:grid;gap:8px}
.aicard .chips{display:flex;flex-wrap:wrap;gap:5px}
.aicard .chips span{font:600 11.5px var(--mono);padding:2px 8px;border-radius:999px;background:#fff;border:1px solid var(--line-2)}
.aicard .chips span.miss{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.aicard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:700}
.cmdfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);background:var(--panel-2);flex-wrap:wrap}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:2}
.mf .grow{flex:1}
.mf.confirmbar{background:color-mix(in srgb,var(--crit) 6%,#fff);font-weight:600;font-size:13px}
.pkq{width:100%;font:600 15px var(--font);padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:8px;color:var(--ink);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b8496' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m20 20-4-4'/></svg>") 11px 50%/16px no-repeat}
.pkq:focus{outline:0;border-color:var(--accent);box-shadow:var(--glow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{position:relative;border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;transition:border-color .12s,box-shadow .12s}
.tile:hover,.tile:focus-visible{border-color:var(--accent);box-shadow:var(--glow);outline:0}
.tile svg{width:46px;height:34px;color:var(--accent)}
.tile b{font-size:14.5px}
.tile small{font-size:12px;color:var(--ink-3);line-height:1.35}
.tile .from{font-size:11.5px;color:var(--ink-2);font-weight:600;font-family:var(--mono)}
.tnum{position:absolute;top:10px;right:10px;font-size:12px;padding:3px 7px}
.tile:hover .tnum,.tile:focus-visible .tnum{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.saved{display:grid;gap:5px}
.saved button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;cursor:pointer;text-align:left}
.saved button:hover{border-color:var(--accent);box-shadow:var(--glow)}
.saved small{color:var(--ink-3)}
.s2grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
.s2col{display:grid;gap:12px;align-content:start;min-width:0}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px;display:grid;gap:6px;justify-items:center}
.drop b{color:var(--ink);font-size:13.5px}
.drop.over{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
.vrows{display:grid;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.vrow{display:grid;grid-template-columns:36px minmax(0,1fr) 78px 26px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:15px;border-radius:5px;height:26px}
.vrow .x:hover{background:var(--hover);color:var(--crit)}
.vrow .num-in{font-family:var(--mono);text-align:right}
.vhead{display:grid;grid-template-columns:36px minmax(0,1fr) 78px 26px;gap:8px;padding:0 8px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rblock{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.rblock h4{margin:0;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.addr{white-space:pre-line;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.addr.missing{color:var(--crit);font-weight:700}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.rline small{color:var(--ink-3);font-size:12px}
.rline .num{text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.steps{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.warnline{font-size:12.5px;color:var(--warn);font-weight:700}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.tabs button{border:0;background:none;padding:12px 10px;font-weight:700;font-size:13px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.grid{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
.grid th{position:static;background:var(--panel-2);padding:7px 8px}
.grid td{padding:6px 8px;border-bottom:1px solid var(--line)}
.grid td .cell{padding:4px 6px}
.mapsel{font:600 11.5px var(--font);padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:#fff;width:100%}
pre.code{margin:0;padding:12px;border-radius:8px;background:var(--hdr);color:#d7deeb;font:12px/1.5 var(--mono);overflow:auto;max-height:260px;white-space:pre}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.keys h4{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.keys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:13px;align-items:center}
.keys dt{white-space:nowrap} .keys dd{margin:0;color:var(--ink-2)}
.proof{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:420px}
.proof .plist{border-right:1px solid var(--line);overflow:auto;max-height:62vh}
.proof .plist button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;text-align:left;cursor:pointer;font-size:12.5px}
.proof .plist button[aria-current="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.proof .plist small{display:block;color:var(--ink-3);font-size:11px}
.proof .pview{padding:14px 18px;display:grid;gap:12px;align-content:start}
.proof svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#f7f8fa}
.pspec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12.5px}
.pspec div{border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.pspec small{display:block;color:var(--ink-3);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 12px 10px 15px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(10,15,25,.3);display:flex;align-items:center;gap:12px}
.toast button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
/* tour */
.tour-hl{position:fixed;z-index:80;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,15,25,.55),0 0 0 3px var(--accent);pointer-events:none;transition:all .2s ease}
.tour-card{position:fixed;z-index:81;width:min(340px,calc(100vw - 32px));background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(10,15,25,.35);padding:16px;display:grid;gap:8px}
.tour-card .eyebrow{color:var(--accent)}
.tour-card h3{margin:0;font-size:16px;font-weight:800}
.tour-card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.tour-card .acts{justify-content:space-between;align-items:center}

/* products catalog + product page */
body.shopmode .cols>.side,body.shopmode .cols>.main,body.shopmode .cols>.pane{display:none!important}
body.shopmode .cols{grid-template-columns:minmax(0,1fr)!important}
.shopv{display:none;overflow:auto}
body.shopmode .shopv{display:block}
.shop-in{max-width:1180px;margin:0 auto;padding:18px 24px 40px}
.shop-in h1{margin:6px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.015em}
.cat-sec{margin-top:22px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0;text-align:left;cursor:pointer;overflow:hidden;display:grid;transition:border-color .12s,box-shadow .12s}
.pcard:hover,.pcard:focus-visible{border-color:var(--accent);box-shadow:var(--glow);outline:0}
.pcard .pic{height:118px;display:grid;place-items:center;background:var(--panel-2);border-bottom:1px solid var(--line);color:var(--accent)}
.pcard .pic svg{width:92px;height:68px}
.pcard .bd{padding:12px 14px 14px;display:grid;gap:5px}
.pcard b{font-size:15px}
.pcard small{color:var(--ink-3);font-size:12.5px;line-height:1.4}
.pcard .from{font:600 12px var(--mono);color:var(--ink-2)}
.pp{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;align-items:start;margin-top:12px}
.pp-left{position:sticky;top:0;display:grid;gap:14px}
.pp-prev{border:1px solid var(--line);border-radius:12px;height:280px;display:grid;place-items:center;position:relative;background:conic-gradient(#eef0f3 25%,#fff 0 50%,#eef0f3 0 75%,#fff 0) 0 0/14px 14px}
.pp-prev .sheet{background:#fff;box-shadow:0 8px 24px rgba(20,30,50,.18);display:grid;place-items:center;overflow:hidden;color:var(--accent)}
.pp-prev .sheet img{width:100%;height:100%;object-fit:cover;display:block}
.pp-prev .sheet svg{width:60%;height:60%}
.pp-prev .dim{position:absolute;bottom:10px;right:12px;font:600 11.5px var(--mono);color:var(--ink-2);background:#fff;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.psum{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;display:grid;gap:10px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.psum .big{font:700 28px/1 var(--mono);letter-spacing:-.02em}
.opt-sec{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:10px}
.opt-sec:first-of-type{border-top:0;padding-top:4px}
.opt-sec h3{margin:0;font-size:14.5px;font-weight:800;display:flex;gap:9px;align-items:center}
.opt-sec h3 .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 11.5px var(--mono);display:grid;place-items:center;flex:none}
.opt-sec h3 small{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:12px}
.chips2{display:flex;flex-wrap:wrap;gap:7px}
.chips2 button{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font:700 13px var(--font);text-align:left;color:var(--ink)}
.chips2 button small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.chips2 button:hover{border-color:var(--ink-3)}
.chips2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sizein{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.sizein input{width:84px;font:500 13px var(--mono);padding:7px 9px;border:1px solid var(--line-2);border-radius:7px;color:var(--ink)}
.sizein input:focus{outline:0;border-color:var(--accent);box-shadow:var(--glow)}
.tiers tr.click{cursor:pointer}
.tiers tr.click:hover td{background:var(--hover)}
.flist{display:grid;gap:6px}
.flist div{display:grid;grid-template-columns:32px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px}
.flist button{border:0;background:none;cursor:pointer;color:var(--ink-3);border-radius:5px;height:26px}
.flist button:hover{color:var(--crit);background:var(--hover)}
/* checkout steps */
.ckst{margin:10px 0 0}
.ckst button{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline}
.addrin.missing{border-color:var(--crit)!important;background:color-mix(in srgb,var(--crit) 4%,#fff)}

function vStatus(t,g,v){

  const m=matById(g.material);
  if(!m) return {k:'crit',txt:'Pick material',block:true};
  if(!v.art) return {k:'warn',txt:'Needs art',block:true};
  if(m.sides&&g.sides===2&&g.back==='diff'&&!v.backArt) return {k:'warn',txt:'Needs back art',block:true};

function art(text,bg,fg,w,h,opt={}){
  const W=320,H=Math.max(60,Math.round(320*h/w));
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  if(bg) s+=`<rect width="${W}" height="${H}" fill="${bg}"/>`;

}

}

function toggleKey(t,key){
  const [kind,gid,vid]=key.split('|'), g=gById(t,gid); if(!g) return;
  if(kind==='g'){ const on=!checked.has(key); g.versions.forEach(v=>checked.delete(keyV(g,v))); on?checked.add(key):checked.delete(key); }

const TIERS=[1,10,25,50,100];
function tierChart(g){

  let cur=0; TIERS.forEach((T,i)=>{ if(q>=T) cur=i; });
  const next=TIERS[cur+1];

  if(next){ const nowEach=unitFor(g,v0,q), thenEach=unitFor(g,v0,next); if(thenEach<nowEach-0.005) nudge=`<div class="nudge">Order ${pcs(next-q)} more (${pcs(next)} total) and each drops to ${money(thenEach)}.</div>`; }

const readURL=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f);});
const readText=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsText(f);});
const imgDim=src=>new Promise(r=>{const im=new Image();let done=false;const fin=v=>{if(!done){done=true;r(v);}};im.onload=()=>fin({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>fin({w:0,h:0});setTimeout(()=>fin({w:0,h:0}),4000);im.src=src;});
async function artFromFile(f){
  if(f.type.startsWith('image/')){
    const src=await readURL(f); if(!src) return null;
    const d=await imgDim(src); if(!d.w||!d.h) return {src,pw:0,ph:0,vector:true};
    return {src,pw:d.w,ph:d.h,opaque:/jpe?g/i.test(f.type)};
  }
  return pdfArt();
}
async function readFiles(files){ const out=[]; for(const f of [...files]) out.push({name:f.name,art:await artFromFile(f)}); return out; }

  return `<div class="bulk" role="toolbar" aria-label="Actions for the selection"><b>${vs.length} file${vs.length===1?'':'s'}</b>
    ${B('product','Product','P')}${B('material','Material','M')}${B('sides','Sides','')}${B('size','Size','Z')}${B('qty','Qty','Q')}${B('fin','Finishing','F')}${B('turn','Turnaround','R')}${B('ship','Ship to','T')}
    <span class="sep"></span>${B('move','Move','V')}${B('group','Group','G',!canGroup)}${B('ungroup','Ungroup','X',!canUngroup)}
    <span class="sep"></span>${B('remove','Remove','Del')}${B('clear','Clear','Esc')}</div>`;

function snapshot(t){ return t.groups.map(g=>({...g,fin:[...g.fin],versions:g.versions.map(v=>({...v,fx:{...v.fx}}))})); }
function undoTo(t,snap){ return ()=>{ t.groups=snap; prune(t); renderAll(); }; }
function fitToMat(g){ const m=matById(g.material); if(!m) return; g.versions.forEach(x=>{ if(m.fixedW&&x.w!==m.fixedW){ x.h=Math.max(6,Math.round(x.h*m.fixedW/x.w)); x.w=m.fixedW; } }); if(!m.sides){ g.sides=1; g.back='same'; } g.fin=g.fin.filter(f=>finById(f).on(m)); }
function targetsV(t){ const s=selVersions(t); return s; }
function bulkApply(kind,val){
  const t=cur(); if(locked(t)) return;
  const all=targetsV(t), vs=['turn','ship'].includes(kind)?all:all.filter(x=>!x.g.sheet), gs=[...new Set(vs.map(x=>x.g))];
  if(!vs.length){ if(all.length) toast('Sheets are set up in the sheet builder. Open one from its details panel.'); return; }
  const snap=snapshot(t), shared=gs.some(g=>g.versions.some(v=>!vs.find(x=>x.v===v)));
  const note=shared?' Specs apply to whole items, so other versions of those items changed too.':'';
  const done=msg=>{ renderAll(); toast(msg,undoTo(t,snap)); };
  if(kind==='product'){ const p=PRODUCTS[val]; gs.forEach(g=>{ g.material=p.preset.material; g.sides=p.preset.sides; g.back='same'; g.fin=[...p.preset.fin]; if(p.id!=='custom') g.versions.forEach(v=>{ v.w=p.preset.w; v.h=p.preset.h; }); fitToMat(g); }); done(`${p.name} specs set on ${gs.length} item${gs.length===1?'':'s'}. Quantities unchanged.${note}`); }
  else if(kind==='material'){ const m=MAT[val]; gs.forEach(g=>{ g.material=m.id; fitToMat(g); }); done(`Material set to ${m.short}.${note}`); }
  else if(kind==='sides'){ let n=0; gs.forEach(g=>{ const m=matById(g.material); if(m&&m.sides){ g.sides=val; if(val===1) g.back='same'; n++; } }); done(n?`${val===2?'2-sided':'1-sided'} on ${n} item${n===1?'':'s'}.${note}`:'Pick a rigid material first. Banners, decals and DTF are 1-sided.'); }
  else if(kind==='size'){ vs.forEach(({g,v})=>{ const m=matById(g.material); if(!(m&&m.fixedW)) v.w=val.w; v.h=val.h; }); done(`Size set on ${vs.length} file${vs.length===1?'':'s'}.`); }
  else if(kind==='qty'){ vs.forEach(({v})=>{ v.qty=val; }); done(`Quantity ${val} on ${vs.length} file${vs.length===1?'':'s'}.`); }
  else if(kind==='fin'){ gs.forEach(g=>{ const m=matById(g.material); if(!m) return; for(const [f,on] of Object.entries(val)){ if(on==null||!finById(f).on(m)) continue; if(on&&!g.fin.includes(f)) g.fin.push(f); if(!on) g.fin=g.fin.filter(x=>x!==f); } }); done(`Finishing updated.${note}`); }
  else if(kind==='turn'){ gs.forEach(g=>{ g.turn=TURN[val].id; }); done(`${TURN[val].label} turnaround on ${gs.length} item${gs.length===1?'':'s'}.${note}`); }
  else if(kind==='ship'){ vs.forEach(({v})=>{ v.shipTo=val; }); done(`${vs.length} file${vs.length===1?'':'s'} going to ${shipLabel(t,val)}.`); }
}
function prodName(g){ const p=PRODUCTS.find(p=>p.preset.material&&p.preset.material===g.material&&p.preset.sides===g.sides); return p?p.name+'s':''; }
function groupSel(){

  const ng={...base,id:uid('g'),fin:[...base.fin],versions:vs.map(x=>x.v),name:base.versions.length>1?base.name:(prodName(base)||baseName(base.name))};

function ungroupSel(){

function moveSel(dest){

  }

  const byG=new Map(); vs.forEach(({g,v})=>{ if(!byG.has(g)) byG.set(g,[]); byG.get(g).push(v); });
  for(const [g,list] of byG){ const ng={...g,id:uid('g'),fin:[...g.fin],shipTo:null,versions:list.map(v=>({...v,shipTo:null}))}; o.groups.push(ng); }

  toast(`Moved ${vs.length} file${vs.length===1?'':'s'} to "${o.name}".`,()=>{ t.groups=snap; if(oSnap) o.groups=oSnap; else orders.splice(orders.indexOf(o),1); renderAll(); });

function applyFix(t,g,v,f){

}

const MAPS=[['ignore','Ignore'],['file','File name'],['name','Version name'],['qty','Quantity'],['w','Width (in)'],['h','Height (in)'],['size','Size (24x18)'],['ship','Ship-to name'],['addr','Ship-to address']];
function guessMap(head,col){
  const h=(head||'').toLowerCase();
  if(/file|image|art/.test(h)) return 'file'; if(/qty|quant|count|pcs/.test(h)) return 'qty'; if(/^w(idth)?\b/.test(h)) return 'w'; if(/^h(eight)?\b/.test(h)) return 'h';
  if(/size|dimension/.test(h)) return 'size'; if(/addr|street/.test(h)) return 'addr'; if(/ship|location|office|store|branch/.test(h)) return 'ship'; if(/name|agent|version/.test(h)) return 'name';
  const v=col.find(x=>x)||'';
  if(/\.(png|jpe?g|pdf|tiff?)$/i.test(v)) return 'file'; if(/^\d+$/.test(v)) return 'qty'; if(/^\d+(\.\d+)?\s*[x×]\s*\d+/i.test(v)) return 'size';
  return 'ignore';
}
function parseRows(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const delim=lines.some(l=>l.includes('\t'))?'\t':',';
  return lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,'')));
}
function openImport(text,intoGroup){
  const t=cur(); if(locked(t)) return; menu.hidden=true;

function prepImport(){
  const rows=parseRows(ctx.text); ctx.rows=rows;
  const first=rows[0]||[]; ctx.head=first.length>0&&first.every(c=>!/^\d+$/.test(c))&&rows.length>1&&rows[1].some(c=>/^\d+$/.test(c));
  const body=ctx.head?rows.slice(1):rows, cols=Math.max(0,...rows.map(r=>r.length));
  ctx.map=Array.from({length:cols},(_,i)=>guessMap(ctx.head?first[i]:'',body.map(r=>r[i])));
}
function importRows(){ const body=ctx.head?ctx.rows.slice(1):ctx.rows; return body.map(r=>{ const o={}; ctx.map.forEach((k,i)=>{ if(k!=='ignore') o[k]=r[i]||''; }); return o; }).filter(o=>Object.values(o).some(Boolean)); }
function matchFile(o){ const key=baseName(o.file||o.name||'').toLowerCase(); return key?ctx.files.find(f=>baseName(f.name).toLowerCase()===key):null; }
function renderImport(){
  const c=ctx, t=cur(), rows=c.rows.length?importRows():[], matched=rows.filter(matchFile).length;
  const head=c.head?c.rows[0]:[];
  modal.innerHTML=`<div class="ph"><div class="eyebrow"><span>Import a spreadsheet</span><span>${rows.length?`${rows.length} rows · ${matched} matched to files`:'Step 1'}</span></div><h2>Rows from your sheet, art from your folder</h2>
    <p>Paste rows from Excel or Google Sheets, or choose a CSV. Then drop the image files and we match them to rows by file name.</p></div>
  <div class="pb"><div class="s2grid">

function finishImport(){

/* ---------- Command palette with AI order entry ---------- */
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12,twenty:20,fifty:50,hundred:100};
function parseOrder(q){
  const s=' '+q.toLowerCase().replace(/[″"]/g,' in ').replace(/['′]/g,' ft ')+' ';
  let prod=null;
  const P=[['yard',/yard|coro|lawn|h-?stake/],['banner',/banner|vinyl banner/],['decal',/decal|window|sticker/],['easel',/easel|foam ?board|foamboard|lobby/],['rigid',/acm|alumin|rigid|panel|dibond|pvc/],['dtf',/dtf|transfer|gang/]];
  for(const [id,re] of P) if(re.test(s)){ prod=id; break; }
  const sizeM=s.match(/(\d+(?:\.\d+)?)\s*(ft|in)?\s*[x×by]{1,2}\s*(\d+(?:\.\d+)?)\s*(ft|in|')?/);
  let w=null,h=null; if(sizeM){ const ft=/ft/.test(sizeM[2]||'')||/ft/.test(sizeM[4]||''); w=+sizeM[1]*(ft?12:1); h=+sizeM[3]*(ft?12:1); }
  let rest=sizeM?s.replace(sizeM[0],' '):s;
  const qm=rest.match(/(?:^|\s)(\d{1,5})(?=\s|$)/)||rest.match(/qty\s*(\d+)/); let qty=qm?+qm[1]:null;
  if(!qty){ for(const [w0,n] of Object.entries(NUMW)) if(new RegExp('\\b'+w0+'\\b').test(rest)){ qty=n; break; } }
  if(!prod&&!sizeM&&!qty) return null;
  if(!prod&&!/sign|print|piece|pc|sheet/.test(s)) return null;
  const p=prodById(prod||'custom');
  const fin=[...(p.preset.fin||[])];
  const add=(id,re)=>{ if(re.test(s)&&!fin.includes(id)) fin.push(id); };
  add('hstake',/stake/); add('grom',/grommet/); add('hem',/\bhem/); add('pole',/pole pocket/); add('round',/round(ed)? corner/); add('contour',/contour|die ?cut|cut to shape/); add('lam',/lam(inate)?/); add('easel',/easel/);
  if(/no stakes|without stakes/.test(s)) fin.splice(fin.indexOf('hstake'),1);
  let sides=p.preset.sides; if(/2[ -]?sided|double[ -]?sided|\b2s\b|both sides/.test(s)) sides=2; if(/1[ -]?sided|single[ -]?sided|\b1s\b/.test(s)) sides=1;
  let turn='std'; if(/same[ -]?day/.test(s)) turn='same'; else if(/rush|next[ -]?day|asap/.test(s)) turn='rush';
  let ship=null; const t=cur();
  if(/pick ?up/.test(s)) ship='pickup';
  else { const sm=s.match(/(?:ship|send|deliver)(?:\s+it|\s+them)?\s+to\s+(?:the\s+)?([a-z0-9 #&'-]+?)(?:\s+(?:office|location|store))?\s*$/)||s.match(/to (?:the )?([a-z0-9 #&'-]+?) office/);
    if(sm){ const name=sm[1].trim(); const hit=t.shipTos.find(x=>x.label.toLowerCase().includes(name))||ACCOUNT.addresses.find(a=>a.label.toLowerCase().includes(name)); ship=hit?{label:hit.label,addr:hit.addr,id:t.shipTos.includes(hit)?hit.id:null}:{label:name.replace(/\b\w/g,c=>c.toUpperCase()),addr:'',id:null,missing:true}; } }
  return {p,prod:p.id,qty:qty||p.preset.qty,qtyGuess:!qty,w:w||p.preset.w,h:h||p.preset.h,sizeGuess:!sizeM,sides,fin,turn,ship};
}
function aiPreview(r){
  const m=matById(r.p.preset.material);
  const g={material:r.p.preset.material,sides:r.sides,fin:r.fin.filter(f=>m&&finById(f).on(m)),turn:r.turn,versions:[{w:r.w,h:r.h,qty:r.qty}]};
  const price=m?unitFor(g,g.versions[0],r.qty)*r.qty:0;
  const chips=[`${pcs(r.qty)}${r.qtyGuess?' (guess)':''}`,r.p.name,`${fmtIn(r.w)} × ${fmtIn(r.h)} in${r.sizeGuess?' (default)':''}`,m&&m.sides?(r.sides===2?'2-sided':'1-sided'):'',...g.fin.map(f=>finById(f).short),turnById(r.turn).label,r.ship==='pickup'?'Pickup':r.ship?`Ship to ${r.ship.label}${r.ship.missing?' (new)':''}`:''].filter(Boolean);
  return `<div class="aicard"><div class="top"><span>✦ AI assist · reads your sentence into an item</span><span>${m?money(price):''}</span></div><div class="chips">${chips.map(c=>`<span${/guess|default|new/.test(c)?' class="miss"':''}>${esc(c)}</span>`).join('')}</div><div class="acts"><button class="btn pri sm" type="button" data-ai="1">Add to ${esc(cur().name)} <kbd>Enter</kbd></button><span class="hint">Check anything marked orange.</span></div></div>`;
}
function addFromAI(r){
  const t=cur(); if(locked(t)) return;
  const g=mkGroup({name:nextName(t,r.p.name==='Custom'?'Custom item':r.p.name),material:r.p.preset.material,sides:r.sides,fin:r.fin,turn:r.turn});
  let shipTo=null;
  if(r.ship==='pickup') t.ship='pickup';
  else if(r.ship){ let s=r.ship.id&&t.shipTos.find(x=>x.id===r.ship.id); if(!s){ s=t.shipTos.find(x=>x.label.toLowerCase()===r.ship.label.toLowerCase()); } if(!s){ s={id:uid('s'),label:r.ship.label,addr:r.ship.addr||''}; t.shipTos.push(s); } if(t.ship==='pickup') t.ship='together'; shipTo=s.id; }
  addVersion(g,{name:g.name,qty:r.qty,w:r.w,h:r.h,shipTo});
  t.groups.push(g); selectOnly(keyG(g)); renderAll(); openDrawer('pane');
  toast(`${g.name} added: ${pcs(r.qty)} at ${fmtIn(r.w)} × ${fmtIn(r.h)} in. Drop the art on its row.`);
}

  }
  return out;
}

  const steps=TOUR.filter(s=>{const el=document.querySelector(s.sel); return el&&el.getClientRects().length;});
  if(!steps.length){ endTour(); return; }
  if(tour.i>=steps.length) tour.i=steps.length-1;
  const s=steps[tour.i], el=document.querySelector(s.sel), r=el.getBoundingClientRect(), hl=$('#tourHl'), card=$('#tourCard'), pad=6;
  const big=r.height>window.innerHeight*0.5;
  Object.assign(hl.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:Math.min(r.height+pad*2,window.innerHeight-r.top+pad-8)+'px'}); hl.hidden=false;
  card.innerHTML=`<div class="eyebrow"><span>Step ${tour.i+1} of ${steps.length}</span><span>Esc to exit</span></div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
    <div class="acts"><button class="btn sm" type="button" data-tour="end">Skip tour</button><span style="display:flex;gap:6px"><button class="btn sm" type="button" data-tour="prev"${tour.i===0?' disabled':''}>Back</button><button class="btn sm pri" type="button" data-tour="next">${tour.i===steps.length-1?'Done':'Next'}</button></span></div>`;
  card.hidden=false;
  const cw=card.offsetWidth, ch=card.offsetHeight;
  let left=big?r.left+16:r.left, top=big?r.top+16:r.bottom+12;
  if(!big&&top+ch>window.innerHeight-8) top=Math.max(8,r.top-ch-12);
  if(big&&r.left>window.innerWidth/2) left=r.left-cw-16;
  left=Math.max(8,Math.min(left,window.innerWidth-cw-8));
  Object.assign(card.style,{left:left+'px',top:Math.max(8,top)+'px'});
  card.querySelector('[data-tour="next"]').focus();
  tour.n=steps.length;
}

modal.addEventListener('keydown',e=>{
  if(ctx?.type==='cmd'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const n=ctx.list.length; if(!n) return; if(ctx.ai){ ctx.ai=null; $('#cmdai').innerHTML=''; } ctx.idx=(ctx.idx+(e.key==='ArrowDown'?1:-1)+n)%n; renderCmdList(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(ctx.ai){ const r=ctx.ai; closeModal(); addFromAI(r); } else runCmd(ctx.idx); }
    return;
  }
  if(ctx?.type==='pick'){
    if(ctx.step==='sheet'&&/^[1-3]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); const tg=ctx.target; openSheetBuilder(Object.keys(SHEETS)[+e.key-1],{dest:tg==='single'?'new':undefined}); return; }
    if(ctx.step===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      const inQ=e.target.id==='pk-q';
      if(inQ){
        if(e.key==='Enter'){ e.preventDefault(); pickEntry(ctx.entries[0]); return; }
        if(e.key==='ArrowDown'){ e.preventDefault(); modal.querySelector('#pk-res [data-pe]')?.focus(); return; }
        if(e.key==='Escape'&&e.target.value){ e.preventDefault(); e.stopPropagation(); e.target.value=''; ctx.q=''; $('#pk-res').innerHTML=pickResultsHTML(); return; }
        if(/^[1-9]$/.test(e.key)&&!e.target.value){ e.preventDefault(); pickEntry(ctx.entries[+e.key-1]); return; }
        return;
      }
      if(/^[1-9]$/.test(e.key)){ e.preventDefault(); pickEntry(ctx.entries[+e.key-1]); return; }
      if(e.key==='/'){ e.preventDefault(); $('#pk-q').focus(); return; }
      if(/^[a-z]$/i.test(e.key)){ const q=$('#pk-q'); q.focus(); return; }
      if(e.key==='ArrowUp'&&e.target.closest('#pk-res')&&e.target===modal.querySelector('#pk-res [data-pe]')){ e.preventDefault(); $('#pk-q').focus(); return; }
    }
    if(ctx.step===2&&e.key==='Enter'&&!ctx.confirm&&!e.target.closest('button,select,textarea')){ e.preventDefault(); addDraft(e.shiftKey); }
  }
  if(ctx?.type==='review'&&ctx.step===1&&e.key==='Enter'&&!e.target.closest('button,input,textarea,select')){ e.preventDefault(); ctx.step=2; renderReview(); return; }
  if(ctx?.type==='proof'&&!e.target.closest('textarea')){ if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); ctx.idx=Math.min(ctx.list.length-1,ctx.idx+1); renderProof(); } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); ctx.idx=Math.max(0,ctx.idx-1); renderProof(); } }
});
function renderCmdList(){

    h+=`<button class="cmdi${k===ctx.idx?' on':''}" type="button" role="option" data-ci="${k}" aria-selected="${k===ctx.idx}"><span>${esc(e.label)}</span><small>${esc(e.hint||'')}</small></button>`; });
  $('#cmdlist').innerHTML=h; $('#cmdlist .cmdi.on')?.scrollIntoView({block:'nearest'});
}

function addFromShop(){
  const c=shop.cfg, p=prodById(shop.pid);
  let t=shop.dest==='new'?null:orders.find(o=>o.id===shop.dest&&o.status==='draft');
  if(!t){ t=mkOrder({name:`${p.name} order ${md()}`}); orders.unshift(t); }
  const base=(c.name||'').trim()||p.name;
  const g=mkGroup({name:base===p.name?nextName(t,base):base,material:c.material,sides:c.sides,back:c.back,fin:c.fin,turn:c.turn});
  if(c.files.length) c.files.forEach(f=>addVersion(g,{name:f.name,art:f.art,qty:c.qty,w:c.w,h:c.h}));
  else addVersion(g,{name:g.name,qty:c.qty,w:c.w,h:c.h});

const shopEl=$('#shop');
shopEl.addEventListener('click',e=>{
  const sbt=e.target.closest('[data-sbt]'); if(sbt){ openSheetBuilder(sbt.dataset.sbt); return; }
  const pc=e.target.closest('[data-prod]'); if(pc){ openProduct(pc.dataset.prod); renderShop(); shopEl.scrollTop=0; return; }
  const c=shop.cfg, b=e.target.closest('button,tr[data-tq]'); if(!b) return;
  const a=b.dataset.shop;
  if(a==='orders'){ exitShop(); renderAll(); return; }
  if(a==='cat'){ shop.page='cat'; renderShop(); shopEl.scrollTop=0; return; }
  if(a==='add'){ addFromShop(); return; }
  if(a==='files'){ $('#shopIn').click(); return; }
  if(a==='goorder'){ const {oid,gid}=shop.added; exitShop(); openOrder(oid); const t=cur(), g=gById(t,gid); if(g){ selectOnly(keyG(g)); renderAll(); } return; }
  if(b.dataset.spm){ c.material=b.dataset.spm; const m=matById(c.material); if(m.fixedW&&c.w!==m.fixedW){ c.w=m.fixedW; } if(!m.sides){ c.sides=1; c.back='same'; } c.fin=c.fin.filter(f=>finById(f).on(m)); shopRerender(); return; }
  if(b.dataset.sps){ const [w,h]=b.dataset.sps.split('x').map(Number); c.w=w; c.h=h; shopRerender(); return; }
  if(b.dataset.spd){ c.sides=+b.dataset.spd; if(c.sides===1) c.back='same'; shopRerender(); return; }
  if(b.dataset.spt){ c.turn=b.dataset.spt; shopRerender(); return; }
  if(b.dataset.tq){ c.qty=+b.dataset.tq; shopRerender(); return; }
  if(b.dataset.spx!==undefined){ c.files.splice(+b.dataset.spx,1); shopRerender(); return; }
});
shopEl.addEventListener('input',e=>{
  const c=shop.cfg, el=e.target; if(!c) return;
  if(el.id==='sp-name'){ c.name=el.value; return; }
  const n=parseFloat(el.value); if(!(n>0)) return;
  if(el.id==='sp-qty') c.qty=Math.round(n); else return;

});
shopEl.addEventListener('change',e=>{
  const c=shop.cfg, el=e.target;
  if(el.id==='sp-dest'){ shop.dest=el.value; return; }
  if((el.id==='sp-w'||el.id==='sp-h')&&c){ const n=parseFloat(el.value); if(n>0){ c[el.id==='sp-w'?'w':'h']=n; shopRerender(); } return; }

  if(el.dataset.spf){ const f=el.dataset.spf; if(el.checked){ if(!c.fin.includes(f)) c.fin.push(f); } else c.fin=c.fin.filter(x=>x!==f); shopRerender(); return; }

});
shopEl.addEventListener('dragover',e=>{ if(shop.page!=='prod') return; e.preventDefault(); $('#sp-drop')?.classList.add('over'); });
shopEl.addEventListener('dragleave',e=>{ if(!shopEl.contains(e.relatedTarget)) $('#sp-drop')?.classList.remove('over'); });

function sheetShare(g,v){ const tot=g.versions.reduce((s,x)=>s+x.w*x.h*x.qty,0)||1; return g.sheet.total*(1+turnById(g.turn).pct)*(v.w*v.h*v.qty)/tot; }
function packSheets(W,H,gap,items){
  /* MaxRects, best short side fit. Each piece reserves its size plus the gap. */
  const list=items.slice().sort((a,b)=>b.w*b.h-a.w*a.h||Math.max(b.w,b.h)-Math.max(a.w,a.h));
  const sheets=[], unfit=[], E=1e-9;
  const inside=(a,b)=>a.x>=b.x-E&&a.y>=b.y-E&&a.x+a.w<=b.x+b.w+E&&a.y+a.h<=b.y+b.h+E;
  const place=(sh,it)=>{
    let best=null;
    for(const f of sh.free) for(const o of it.os){
      const ww=o[0]+gap, hh=o[1]+gap; if(ww>f.w+E||hh>f.h+E) continue;
      const ss=Math.min(f.w-ww,f.h-hh), ls=Math.max(f.w-ww,f.h-hh);
      if(!best||ss<best.ss-E||(Math.abs(ss-best.ss)<E&&(ls<best.ls-E||(Math.abs(ls-best.ls)<E&&f.y+f.x<best.y+best.x)))) best={x:f.x,y:f.y,w:o[0],h:o[1],ww,hh,rot:o[2],ss,ls};
    }
    if(!best) return false;
    const r={x:best.x,y:best.y,w:best.ww,h:best.hh}, nf=[];
    for(const f of sh.free){
      if(r.x>=f.x+f.w-E||r.x+r.w<=f.x+E||r.y>=f.y+f.h-E||r.y+r.h<=f.y+E){ nf.push(f); continue; }
      if(r.x>f.x+E) nf.push({x:f.x,y:f.y,w:r.x-f.x,h:f.h});
      if(r.x+r.w<f.x+f.w-E) nf.push({x:r.x+r.w,y:f.y,w:f.x+f.w-r.x-r.w,h:f.h});
      if(r.y>f.y+E) nf.push({x:f.x,y:f.y,w:f.w,h:r.y-f.y});
      if(r.y+r.h<f.y+f.h-E) nf.push({x:f.x,y:r.y+r.h,w:f.w,h:f.y+f.h-r.y-r.h});
    }
    sh.free=nf.filter((a,i)=>!nf.some((b,j)=>j!==i&&inside(a,b)&&(j<i||!inside(b,a))));
    sh.placed.push({cid:it.cid,x:best.x,y:best.y,w:best.w,h:best.h,rot:best.rot});
    return true;
  };
  for(const it of list){
    it.os=[[it.w,it.h,false],[it.h,it.w,true]].filter(o=>it.allow==='n'?!o[2]:it.allow==='r'?o[2]:true);
    if(!it.os.some(o=>o[0]<=W+E&&o[1]<=H+E)){ unfit.push(it); continue; }
    let ok=false; for(const sh of sheets){ if(place(sh,it)){ ok=true; break; } }
    if(!ok){ if(sheets.length>=60){ unfit.push(it); continue; } const sh={free:[{x:0,y:0,w:W+gap,h:H+gap}],placed:[]}; sheets.push(sh); place(sh,it); }
  }
  return {sheets,unfit};
}

function calcSheet(st){
  const S=SHEETS[st.type], C=sheetCut(st), m=matById(st.material), items=sbItems(st.cards,st);
  const r=packSheets(st.W,st.H,C.gap,items), sq=st.W*st.H/144;
  const two=!!S.sides&&st.cards.some(c=>c.sides===2&&c.qty>0);
  const lamOn=st.lam&&S.lam&&!(S.lam.skip||[]).includes(st.material);
  const unit=sq*m.rate*S.disc*(two?1.4:1)+(C.sf?sq*C.sf:0)+(lamOn?sq*S.lam.sf:0);
  const pieces=items.length-r.unfit.length, total=r.sheets.length*unit+(C.pp||0)*pieces;
  const byCard={}; st.cards.forEach(c=>byCard[c.id]={placed:0,unfit:0,share:0});
  let area=0; r.sheets.forEach(s=>{ let a=0; s.placed.forEach(p=>{ byCard[p.cid].placed++; a+=p.w*p.h; }); s.util=a/(st.W*st.H); area+=a; });
  r.unfit.forEach(u=>byCard[u.cid].unfit++);
  st.cards.forEach(c=>{ byCard[c.id].share=area?total*(c.w*c.h*byCard[c.id].placed)/area:0; });
  return {...r,unit,total,pieces,byCard,two};
}

function orderStage(o){
  if(o.status!=='paid') return null;
  let best=99; o.groups.forEach(g=>g.versions.forEach(v=>{ const p=(v.prod||'Queued').startsWith('Ready')?'Ready':(v.prod||'Queued'); const i=STAGES.findIndex(s=>s[0]===p); if(i>=0&&i<best) best=i; }));
  return best===99?'Queued':STAGES[best][0];
}
function setStage(o,s){
  const today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(s==='Done'){ o.status='done'; o.doneOn=today; o.groups.forEach(g=>g.versions.forEach(v=>{ v.prod=o.ship==='pickup'?'Picked up':'Shipped'; })); return; }
  const txt=s==='Ready'?(o.ship==='pickup'?'Ready for pickup':'Ready to ship'):s;
  o.groups.forEach(g=>g.versions.forEach(v=>{ v.prod=txt; if(s==='Proof ready') v.approved=false; }));
}

const boEl=$('#bo');
boEl.addEventListener('click',e=>{
  const n2=e.target.closest('[data-nav2]'); if(n2){ const p=n2.dataset.nav2; if(p==='desk') exitBo(); else enterBo(p); return; }
  const b=e.target.closest('[data-bo]'); if(!b) return;
  const a=b.dataset.bo, hit=b.dataset.o?allOrders().find(x=>x.o.id===b.dataset.o):null, o=hit?.o;
  const say=m=>{ renderBo(); toast(m); };
  if(a==='open'){ openFromBo(b.dataset.a,b.dataset.o); return; }
  if(a==='desk'){ openFromBo(b.dataset.a,null); return; }
  if(a==='newfor'){ exitBo(); toast('Pick the customer in the sidebar, then press N for a new order.'); $('#acctSel')?.focus(); return; }
  if(a==='proof'&&o){ setStage(o,'Proof ready'); o.proofSent=new Date(); o.groups.forEach(g=>g.versions.forEach(v=>{ v.changeNote=''; })); say(`Revised proof link emailed to ${hit.a.contact} for ${o.number}.`); return; }
  if(a==='resend'&&o){ (o.reminders=o.reminders||[]).push(new Date()); say(`Proof reminder sent to ${hit.a.email}.`); return; }
  if(a==='remindfile'&&o){ say(`Emailed ${hit.a.contact} again about the file that didn't pass.`); return; }
  if(a==='asis'&&o){ o.groups.forEach(g=>g.versions.forEach(v=>{ if(v.prod==='File needs fix'){ v.prod=o.proof?'Proof ready':'Queued'; v.asIs=true; v.fileIssue=''; } })); if(o.proof) o.proofSent=new Date(); say(`${o.number} will print as is. File issues aren't covered by a free reprint.`); return; }
  if(a==='release'&&o){ o.cancelUntil=null; say(`${o.number} released to print. The customer can't cancel it online now.`); return; }
  if(a==='flag'&&o){ openFlag(hit.a.id,o.id); return; }
  if(a==='resolve'&&o){ o.issue.resolved=true; say(`Issue on ${o.number} resolved. Job back in the queue.`); return; }
  if(a==='approve'&&o){ setStage(o,'Queued'); say(`${o.number} files OK. Queued for production.`); return; }
  if(a==='queue'&&o){ o.groups.forEach(g=>g.versions.forEach(v=>{ v.approved=true; })); setStage(o,'Queued'); say(`${o.number} approved for the customer and sent to print.`); return; }
  if(a==='print'&&o){ setStage(o,'Printing'); say(`${o.number} is printing.`); return; }
  if(a==='ready'&&o){ setStage(o,'Ready'); say(`${o.number} is ${o.ship==='pickup'?'ready for pickup. Pickup email sent.':'ready to ship.'}`); return; }
  if(a==='done'&&o){ setStage(o,'Done'); say(`${o.number} ${o.ship==='pickup'?'picked up':'shipped. Tracking emailed'}.`); return; }
  if(a==='approveacct'){ const A=acctById(b.dataset.a); A.status='approved'; A.credits+=25; A.ledger.unshift({when:new Date(),who:STAFF.name,action:'Welcome credits',file:'',n:25,kind:'grant'}); say(`${A.name} approved. Welcome email sent with 25 free AI credits.`); return; }
  if(a==='declineacct'){ const A=acctById(b.dataset.a); A.status='declined'; say(`${A.name} declined for trade. We emailed them about a retail account on patriotpf.com.`); return; }
  if(a==='grant'){ const A=acctById(b.dataset.a); A.credits+=50; A.ledger.unshift({when:new Date(),who:STAFF.name,action:'Credits added by staff',file:'',n:50,kind:'grant'}); renderWho(); say(`Added 50 AI credits to ${A.name}.`); return; }
  if(a==='addcust'){ toast('Demo: adding customers opens a form in the live back office.'); return; }
});
boEl.addEventListener('input',e=>{
  const el=e.target, v=parseFloat(el.value);
  if(el.dataset.rate!==undefined&&v>=0){ MAT[+el.dataset.rate].rate=v; const r=boEl.querySelector(`[data-retail="${el.dataset.rate}"]`); if(r) r.textContent=money(v*RETAIL_MULT); return; }
  if(el.id==='bo-mult'&&v>=1){ RETAIL_MULT=v; MAT.forEach((m,i)=>{ const r=boEl.querySelector(`[data-retail="${i}"]`); if(r) r.textContent=money(m.rate*RETAIL_MULT); }); return; }
  if(el.dataset.turn!==undefined&&v>=0){ TURN[+el.dataset.turn].pct=v/100; return; }
  if(el.dataset.aicost&&v>=0){ AI_COST[el.dataset.aicost]=Math.round(v); return; }
  if(el.dataset.pack!==undefined&&v>=0){ CREDIT_PACKS[+el.dataset.pack].price=v; return; }
  if(el.id==='set-cut'&&v>=0){ CUTOFF=Math.round(v); return; }
  if(el.id==='set-remind'&&v>0){ REMIND_H=v; return; }
  if(el.id==='set-cancel'&&v>=0){ CANCEL_MIN=Math.round(v); return; }
  if(el.dataset.days&&v>=0){ STD_DAYS[el.dataset.days]=Math.round(v); return; }
});

let toastT;
function toast(m,undo){
  if(!m) return;
  const el=$('#toast'); el.innerHTML=`<span>${esc(m)}</span>${undo?`<button type="button" id="undoBtn">Undo</button>`:''}`; el.hidden=false;
  if(undo) $('#undoBtn').onclick=()=>{ el.hidden=true; undo(); toast('Undone.'); };
  clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},undo?7000:4200);
}
