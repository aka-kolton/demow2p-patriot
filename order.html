  const pg=t.closest('[data-pg]'); if(pg){ const [k,n]=pg.dataset.pg.split(':'); (k==='o'?BOQ:BOCQ).page=+n; renderBo(); $('#bo').scrollTop=0; return; }
  const tg=t.closest('[data-ot]'); if(tg){ const id=tg.dataset.ot; BOCOL.has(id)?BOCOL.delete(id):BOCOL.add(id); renderBo(); return; }
  const jb=t.closest('[data-jb]'); if(jb){ const [aid,oid]=jb.dataset.jb.split('|'); openJob(aid,oid); return; }
  const jv=t.closest('[data-jbv]'); if(jv){ JBV=jv.dataset.jbv; renderBo(); return; }
  const ia=t.closest('[data-ia]'); if(ia){ itemAction(ia.dataset.ia,ia.dataset.a,ia.dataset.o,ia.dataset.v); return; }
  const qa=t.closest('[data-qa]'); if(qa){ const k=qa.dataset.qa; if(k==='paid'){ const hit=allOrders().find(x=>x.o.id===qa.dataset.o); hit.o.collected=true; renderBo(); toast(`${hit.o.number} marked paid.`); return; } boFake(k,qa.dataset.a,qa.dataset.o); return; }
  const qf=t.closest('[data-qf]'); if(qf){ const k=qf.dataset.qf; BOQ={...BOQ,q:'',co:'',stage:'',prod:'',type:'',flag:k==='flag',rush:false,status:k==='waiting'?'waiting':'open',sort:'due',page:1}; enterBo('orders'); return; }
  const b=t.closest('[data-bo]'); if(!b) return; const a=b.dataset.bo;
  if(a==='oreset'){ BOQ={q:'',co:'',from:'',to:'',status:'open',stage:'',prod:'',type:'',flag:false,rush:false,sort:'due',per:BOQ.per,page:1}; renderBo(); return; }
  if(a==='selnone'){ BOSEL.clear(); renderBo(); return; }
  if(a==='colall'){ const vis=filteredOrders(BOQ).slice((BOQ.page-1)*BOQ.per,BOQ.page*BOQ.per); const all=vis.every(x=>BOCOL.has(x.o.id)); vis.forEach(x=>all?BOCOL.delete(x.o.id):BOCOL.add(x.o.id)); renderBo(); return; }
  if(a==='export'){ const n=exportCSV(filteredOrders(BOQ)); toast(`Exported ${pcs(n)} orders to patriot-orders.csv.`); return; }
  if(a==='cust1'||a==='custorders'){ const A=acctById(b.dataset.a); BOQ={...BOQ,q:'',co:A.name,status:'all',stage:'',prod:'',type:'',flag:false,rush:false,sort:'new',page:1}; enterBo('orders'); toast(`Showing every order from ${A.name}.`); return; }
  if(a==='bulk'){ const act=$('#o-bulk').value; if(!act){ toast('Pick a bulk action first.'); return; }
    const sel=allOrders().filter(x=>BOSEL.has(x.o.id)); let n=0;
    if(act==='export'){ n=exportCSV(sel); toast(`Exported ${n} selected orders.`); return; }
    if(act==='ticket'){ toast(`${sel.length} job tickets sent to the shop printer.`); return; }
    sel.forEach(({o})=>{ const s=orderStage(o);
      if(act==='print'&&s==='Queued'){ setStage(o,'Printing'); n++; }
      else if(act==='ready'&&s==='Printing'){ setStage(o,'Ready'); n++; }
      else if(act==='done'&&s==='Ready'){ setStage(o,'Done'); n++; }
      else if(act==='remind'&&s==='Proof ready'){ (o.reminders=o.reminders||[]).push(new Date()); n++; }
      else if(act.startsWith('dept:')){ o.groups.forEach(g=>g.versions.forEach(v=>{ v.dept=act.slice(5); })); n++; } });
    const skip=sel.length-n; BOSEL.clear(); renderBo(); toast(`Updated ${n} order${n===1?'':'s'}.${skip?` Skipped ${skip} that weren't at the right stage.`:''}`); return; }
});
boEl.addEventListener('change',e=>{
  const el=e.target, id=el.id, v=el.value;
  const OQ={'oq-status':'status','oq-stage':'stage','oq-prod':'prod','oq-type':'type','oq-sort':'sort','oq-from':'from','oq-to':'to'};
  if(OQ[id]){ BOQ[OQ[id]]=v; BOQ.page=1; renderBo(); return; }
  if(id==='oq-per'){ BOQ.per=+v; BOQ.page=1; renderBo(); return; }
  if(id==='oq-flag'||id==='oq-rush'){ BOQ[id==='oq-flag'?'flag':'rush']=el.checked; BOQ.page=1; renderBo(); return; }
  const CQ={'cq-type':'type','cq-status':'status','cq-sort':'sort'};
  if(CQ[id]){ BOCQ[CQ[id]]=v; BOCQ.page=1; renderBo(); return; }
  if(id==='cq-per'){ BOCQ.per=+v; BOCQ.page=1; renderBo(); return; }
  if(id==='jb-dept'){ JBD=v; renderBo(); return; }
  if(el.dataset.osel){ el.checked?BOSEL.add(el.dataset.osel):BOSEL.delete(el.dataset.osel); renderBo(); return; }

  if(el.dataset.iact){ const [oid,vid]=el.dataset.iact.split('|'), hit=allOrders().find(x=>x.o.id===oid), k=v; el.value=''; if(k&&hit) itemAction(k,hit.a.id,oid,vid); return; }

});

boEl.addEventListener('input',e=>{
  const el=e.target, v=parseFloat(el.value);
  if(el.dataset.rate!==undefined&&v>=0){ MAT[+el.dataset.rate].rate=v; const r=boEl.querySelector(`[data-retail="${el.dataset.rate}"]`); if(r) r.textContent=money(v*RETAIL_MULT); return; }

  if(el.id==='bo-mult'&&v>=1){ RETAIL_MULT=v; MAT.forEach((m,i)=>{ const r=boEl.querySelector(`[data-retail="${i}"]`); if(r) r.textContent=money(m.rate*RETAIL_MULT); }); return; }

  if(el.dataset.aicost&&v>=0){ AI_COST[el.dataset.aicost]=Math.round(v); return; }
  if(el.dataset.pack!==undefined&&v>=0){ CREDIT_PACKS[+el.dataset.pack].price=v; return; }
  if(el.id==='set-cut'&&v>=0){ CUTOFF=Math.round(v); return; }

  if(el.id==='set-cancel'&&v>=0){ CANCEL_MIN=Math.round(v); return; }

});

function orderStatus(o){
  if(o.status==='draft') return ['Draft','s-gray'];
  if(o.status==='approval') return ['Waiting for approval','s-warn'];
  if(o.status==='done') return ['Completed','s-done'];
  if(o.issue&&!o.issue.resolved&&o.issue.held) return ['On hold','s-crit'];
  const s=orderStage(o);
  if(['File needs fix','Changes requested','Proof ready'].includes(s)) return ['Waiting on customer','s-purple'];
  if(s==='Checking files') return ['Order processing','s-info'];
  if(s==='Ready') return [o.ship==='pickup'?'Ready for pickup':'Ready to ship','s-good'];
  return ['In production','s-red'];
}

      const t=new Date(day); t.setHours(wk?ri(9,16):ri(6,20),ri(0,59),0,0); if(t>now) continue;

    }
  }
  list.sort((x,y)=>x-y);
  let num=10476-list.length, line=17000-list.length*2;
  const prev=ACCOUNT;
  for(const t of list){
    const a=pickAcct(); ACCOUNT=a;
    const age=(now-t)/DAY, ship=a.type==='retail'?(R()<.6?'pickup':'together'):pick(['pickup','pickup','together','asready','together']);
    const o=mkOrder({name:'',po:R()<.6?`${a._s.slice(0,3).toUpperCase()}-${ri(100,9999)}`:'',ship,blind:a.type==='trade'&&ship!=='pickup'&&R()<.6,proof:a.type==='retail'?true:R()<.35,status:'paid',number:'PBP-'+(num++),paidBy:'card'});

    }

    else {

      else if(o.proof&&fr<.45&&r<.55) st=r<.06?'Changes requested':'Proof ready';
      else if(r<.025) st='File needs fix';
      else if(fr<.3) st=r<.7?'Queued':'Printing';
      else if(fr<.7) st=r<.3?'Queued':r<.8?'Printing':'Ready';
      else if(fr<1) st=r<.35?'Printing':'Ready';
      else st=r<.05?'Printing':'Ready';
      o.groups.forEach((g,i)=>g.versions.forEach(v=>{
        let s2=st; if(st==='Printing'&&R()<.35) s2=R()<.5?'Queued':'Ready'; if(st==='Ready'&&R()<.2) s2='Printing';

    }

  }
  ACCOUNT=prev;
  gen.forEach(a=>{ ORD[a.id].reverse(); });

}

function orderMatches(o,a,Q){

  if(Q.status==='waiting'&&!(o.status==='paid'&&['File needs fix','Changes requested','Proof ready'].includes(orderStage(o)))) return false;
  if(Q.status==='prod'&&!(o.status==='paid'&&['Queued','Printing'].includes(orderStage(o)))) return false;
  if(Q.status==='ready'&&!(o.status==='paid'&&orderStage(o)==='Ready')) return false;
  if(Q.status==='done'&&o.status!=='done') return false;
  if(Q.status==='draft'&&!['draft','approval'].includes(o.status)) return false;
  if(Q.status!=='draft'&&Q.status!=='all'&&o.status==='draft') return false;
  if(Q.type&&a.type!==Q.type) return false;
  if(Q.flag&&!(o.issue&&!o.issue.resolved)) return false;

  const p=placedOf(o);
  if(Q.from&&(!p||p<new Date(Q.from+'T00:00'))) return false;
  if(Q.to&&(!p||p>new Date(Q.to+'T23:59'))) return false;
  if(Q.co&&!a.name.toLowerCase().includes(Q.co.toLowerCase())) return false;
  if(Q.q){ const q=Q.q.toLowerCase().replace(/^pbp-?/,''); const hay=[o.number,o.name,o.po,a.contact,a.email,a.name,...o.groups.flatMap(g=>g.versions.map(v=>v.name+' '+(v.line||'')))].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}

    if(s==='File needs fix') out.push(['remindfile','Email about the file'],['asis','Print as is']);

    if(s==='Printing') out.push(['ready','Done printing']);
    if(s==='Ready') out.push(['done',o.ship==='pickup'?'Mark picked up':'Mark shipped']);
    if(o.cancelUntil&&Date.now()<o.cancelUntil) out.push(['release','Release to print now']);
    out.push(o.issue&&!o.issue.resolved?['resolve','Resolve issue']:['flag','Flag an issue']);
  }
  out.push(['ticket','Print job ticket']);
  return out;
}

function salesSVG(){
  const now=new Date(), months=[]; for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:d.getFullYear(),m:d.getMonth(),amt:0,n:0}); }
  allOrders().forEach(({o,a})=>{ if(o.status!=='paid'&&o.status!=='done') return; const p=placedOf(o); if(!p) return; const b=months.find(x=>x.y===p.getFullYear()&&x.m===p.getMonth()); if(b){ b.amt+=totalOf(o,a); b.n++; } });
  const W=720,H=260,L=56,Rt=44,T=18,B=34, maxA=Math.max(...months.map(x=>x.amt))*1.15||1, maxN=Math.max(...months.map(x=>x.n))*1.3||1, bw=(W-L-Rt)/12;
  const X=i=>L+bw*i+bw/2, YA=v=>T+(H-T-B)*(1-v/maxA), YN=v=>T+(H-T-B)*(1-v/maxN);
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let g=''; for(let k=0;k<=4;k++){ const v=maxA*k/4, y=YA(v); g+=`<line x1="${L}" x2="${W-Rt}" y1="${y}" y2="${y}" class="gl"/><text x="${L-6}" y="${y+4}" text-anchor="end" class="ax">$${Math.round(v/1000)}k</text>`; }
  const bars=months.map((b,i)=>`<rect x="${X(i)-bw*.28}" y="${YN(b.n)}" width="${bw*.56}" height="${H-B-YN(b.n)}" class="bar2"><title>${b.n} orders</title></rect><text x="${X(i)}" y="${YN(b.n)-4}" text-anchor="middle" class="ax">${b.n}</text>`).join('');
  const path=months.map((b,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${YA(b.amt).toFixed(1)}`).join(' ');
  const dots=months.map((b,i)=>`<circle cx="${X(i)}" cy="${YA(b.amt)}" r="3.5" class="dot"><title>${MO[b.m]} ${b.y}: ${money(b.amt)}, ${b.n} orders</title></circle>`).join('');
  const lbl=months.map((b,i)=>`<text x="${X(i)}" y="${H-12}" text-anchor="middle" class="ax">${MO[b.m]}${b.m===0||i===0?' '+String(b.y).slice(2):''}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Sales by month for the last 12 months">${g}${bars}<path d="${path}" class="ln"/>${dots}${lbl}</svg>
    <div class="legend"><span><i class="lg-ln"></i>Sales ($)</span><span><i class="lg-bar"></i>Orders (count)</span></div>`;
}
function salesStats(){
  const all=allOrders().filter(({o})=>(o.status==='paid'||o.status==='done')&&placedOf(o)), now=new Date();
  const d0=new Date(now); d0.setHours(0,0,0,0); const dd=n=>new Date(+d0-n*864e5);
  const wk0=dd((now.getDay()+6)%7), m0=new Date(now.getFullYear(),now.getMonth(),1), y0=new Date(now.getFullYear(),0,1);
  const R=(a,b)=>{ const xs=all.filter(({o})=>{ const p=placedOf(o); return p>=a&&p<b; }); return [xs.reduce((s,{o,a})=>s+totalOf(o,a),0),xs.length]; };
  const ly0=new Date(now.getFullYear()-1,0,1), lyNow=new Date(now.getFullYear()-1,now.getMonth(),now.getDate()+1);
  const P=[['Today',R(d0,now)],['Yesterday',R(dd(1),d0)],['This week',R(wk0,now)],['Last week',R(new Date(+wk0-7*864e5),wk0)],['This month',R(m0,now)],['Last month',R(new Date(now.getFullYear(),now.getMonth()-1,1),m0)],['This year',R(y0,now)],['Last year, same dates',R(ly0,lyNow)]];
  return `<div class="stats">${P.map(([l,[amt,n]])=>`<div><small>${l}</small><b class="num">${money(amt)}</b><span class="note">${pcs(n)} orders</span></div>`).join('')}</div>`;
}

function exportCSV(rows){

  const csv=lines.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{ const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); const l=document.createElement('a'); l.href=u; l.download='patriot-orders.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }catch(e){}
  return lines.length-1;
}

let toastT;
function toast(m,undo){
  if(!m) return;
  const el=$('#toast'); el.innerHTML=`<span>${esc(m)}</span>${undo?`<button type="button" id="undoBtn">Undo</button>`:''}`; el.hidden=false;
  if(undo) $('#undoBtn').onclick=()=>{ el.hidden=true; undo(); toast('Undone.'); };
  clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},undo?7000:4200);
}
